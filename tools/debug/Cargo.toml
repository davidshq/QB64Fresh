[package]
name = "qb64fresh-debug"
version = "0.1.0"
edition = "2021"
description = "Debugger for QB64Fresh BASIC programs"
authors = ["QB64Fresh Contributors"]
license = "MIT"

[[bin]]
name = "qb64fresh-debug"
path = "src/main.rs"

[lib]
name = "qb64fresh_debug"
path = "src/lib.rs"

[dependencies]
# Use the main compiler library for lexing, parsing, and semantic analysis
qb64fresh = { path = "../.." }

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Serialization for config files and debug protocol
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"
tempfile = "3"
