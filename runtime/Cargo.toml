[package]
name = "qb64fresh-runtime"
version = "0.1.0"
edition = "2021"
description = "Runtime library for QB64Fresh compiled programs"
license = "MIT"

[lib]
name = "qb64fresh_rt"
# Build as both a Rust library (for tests) and a C-compatible static library
crate-type = ["lib", "staticlib"]

[dependencies]
# C library bindings (for strcmp, etc.)
libc = "0.2"

# For graphics support
# Note: "ttf" feature requires SDL2_ttf library installed on the system
sdl2 = { version = "0.38", optional = true }

# For image loading (_LOADIMAGE support)
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "bmp", "gif"] }

# For audio support (pure Rust audio library)
rodio = { version = "0.21", optional = true }

# For native file dialogs (_OPENFILEDIALOG$, _SAVEFILEDIALOG$, etc.)
rfd = { version = "0.17", optional = true }

[features]
default = ["graphics-sdl2", "audio-rodio", "dialogs"]
graphics-sdl2 = ["sdl2", "image"]
graphics-sdl2-ttf = ["sdl2/ttf"]  # Requires SDL2_ttf library
graphics-mock = []  # For testing without display
audio-rodio = ["rodio"]
audio-mock = []  # For testing without audio
dialogs = ["rfd"]  # Native file dialogs

[dev-dependencies]
# For testing
